    <body class="index">
        <div class="bg-text"></div>
        <header>
            <a id="back" href="index.html">&lt;</a>
        </header>

        <div class="menu">
            <span class="menu-item" id="menu-profile"><a href="profile.html">PROFILE</a></span>

            <span class="menu-item" id="menu-credits"><a href="credits.html">CREDITS</a></span>

        <div id="colorwheel" class="window">
            <div class="titlebar">
                <span>colorwheel</span>
                <span class="minimize">-</span>
            </div>
            <div class="window_wrapper">
                <div class="content">
                    <div class="wheel">
                        <div class="inner-border"></div>
                        <div class="wheelmask"></div>
                        <div class="colorpicker">
                            <div class="picker-dot"></div>
                        </div>
                    </div>
                </div>
                <div class="maincolor"></div>
                <div class="secondcolor"></div>
                <div class="thirdcolor"></div>
                <div class="hsv">
                    <span class="hsv-item">h</span>
                    <span class="h-value">0</span>
                    <span class="hsv-item">s</span>
                    <span class="s-value">0</span>
                    <span class="hsv-item">v</span>
                    <span class="v-value">0</span>
                </div>
                <div class="orbit">
                    <div class="orbit-dot"></div>
                </div>
            </div>
        </div>

        <div class="window" style="height: 100px;">
            <div class="titlebar">
                <span class="title">new_window</span>
                <div class="btn">
                    <span class="minimize">-</span>
                    <span class="close">x</span>
                </div>
            </div>
            <div class="window_wrapper">
                <div class="content">
                    <span class="post">
                        the lion goes to bed at reasonable time
                    </span>
                </div>
            </div>
        </div>

        <div class="window" style="height: 100px;">

            <div class="window_wrapper">

                    </span>
                </div>
            </div>
        </div>

        <div class="window" style="height: 100px;">
            <div class="titlebar">

                    <span class="minimize">-</span>

            </div>
